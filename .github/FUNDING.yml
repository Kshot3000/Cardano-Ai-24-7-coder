# Funding
#
# GitHub's funding-file schema only accepts its listed platform keys
# (github, patreon, open_collective, ko_fi, custom, …). There is no
# `cardano:` key — the previous version of this file used one, which made
# the whole file invalid so GitHub ignored it. The Cardano donation
# address therefore lives in README.md ("Donation") and ORGS_PRIORITY.md,
# where it renders and copies correctly.
